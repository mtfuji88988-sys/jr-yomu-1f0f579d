<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>购物清单</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FAF6F0;color:#2B2620;font-family:"Songti SC","Noto Serif SC",Georgia,serif;padding:26px 16px 60px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:21px;border-bottom:3px solid #C15F3C;padding-bottom:8px}
.sub{color:#8A7F72;font-size:11.5px;margin:6px 0 4px}
#syncst{color:#8A7F72;font-size:11.5px;margin-bottom:12px;cursor:pointer}
.addrow{display:flex;gap:8px;margin:10px 0 16px}
#newitem{flex:1;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid #D8C9B6;border-radius:9px;background:#fff}
#addbtn{font:inherit;font-size:15px;padding:10px 16px;border:none;border-radius:9px;background:#C15F3C;color:#fff}
#addbtn:active{opacity:.8}
.it{background:#fff;border:1px solid #E5DCD0;border-radius:9px;padding:12px 13px;margin:7px 0;display:flex;gap:11px;align-items:center;font-size:15.5px}
.it .c{color:#C15F3C;flex:none;font-size:19px;width:26px;text-align:center;cursor:pointer}
.it .t{flex:1;word-break:break-all}
.it .w{font-size:10.5px;color:#8A7F72;flex:none}
.it.done{opacity:.5}.it.done .t{text-decoration:line-through}.it.done .c{color:#4C7A5E}
h2{font-size:13px;color:#8A7F72;margin:20px 0 4px}
.empty{color:#8A7F72;text-align:center;padding:26px}
#clearbtn{display:block;margin:18px auto 0;font:inherit;font-size:12.5px;padding:7px 16px;border:1px solid #D8C9B6;border-radius:16px;background:#fff;color:#8A7F72}
.mut{color:#B5AB9E;font-size:11px;margin-top:18px;text-align:center}
</style></head><body><div class="wrap">
<h1>购物清单</h1>
<div class="sub" id="cnt"></div>
<div id="syncst">🔄 同步中…</div>
<div class="addrow"><input id="newitem" placeholder="想买什么,写这里…" enterkeyhint="done"><button id="addbtn">加</button></div>
<div id="open"></div>
<h2 id="doneh" style="display:none">已买完</h2>
<div id="donelist"></div>
<button id="clearbtn" style="display:none">清掉"已买完"里的这些</button>
<div class="mut">所有设备自动同步 · 网址即钥匙请勿转发</div>
</div>
<script>
const EP='https://autumn-leaf-bdac.mtfuji88988.workers.dev/s-4wq8n2kp7f';
const KEY='slItems';
let items={};try{items=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const stEl=document.getElementById('syncst');
let pushTimer=null,pushing=false;
function setSt(s){stEl.textContent=s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmt(ms){const d=new Date(ms);return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function render(){
  const open=[],done=[];
  Object.entries(items).forEach(([id,it])=>{if(it.del)return;(it.done?done:open).push([id,it])});
  open.sort((a,b)=>a[1].ts-b[1].ts);done.sort((a,b)=>b[1].ts-a[1].ts);
  document.getElementById('cnt').textContent='待买 '+open.length+' 项';
  const row=(id,it)=>`<div class="it${it.done?' done':''}" data-id="${id}"><span class="c">${it.done?'✓':'○'}</span><span class="t"></span><span class="w">${it.c||''}</span></div>`;
  const ob=document.getElementById('open');
  ob.innerHTML=open.length?open.map(([i,x])=>row(i,x)).join(''):'<div class="empty">清单空了 🎉</div>';
  const db=document.getElementById('donelist');
  db.innerHTML=done.map(([i,x])=>row(i,x)).join('');
  document.getElementById('doneh').style.display=done.length?'':'none';
  document.getElementById('clearbtn').style.display=done.length?'':'none';
  document.querySelectorAll('.it').forEach(el=>{
    const it=items[el.dataset.id];if(!it)return;
    el.querySelector('.t').textContent=it.t;
    el.querySelector('.c').onclick=()=>{it.done=!it.done;it.ts=Date.now();save();render();schedPush()};
  });
}
document.getElementById('addbtn').onclick=add;
document.getElementById('newitem').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
function add(){
  const inp=document.getElementById('newitem');const t=inp.value.trim();if(!t)return;
  const now=Date.now();
  items[uid()]={t,done:false,del:false,ts:now,c:fmt(now)};
  inp.value='';save();render();schedPush();
}
document.getElementById('clearbtn').onclick=()=>{
  Object.values(items).forEach(it=>{if(it.done&&!it.del){it.del=true;it.ts=Date.now()}});
  save();render();schedPush();
};
function mergeRemote(ri){
  let localAhead=false,changed=false;
  const ids=new Set([...Object.keys(ri),...Object.keys(items)]);
  ids.forEach(id=>{
    const r=ri[id],l=items[id];
    if(r&&!l){items[id]=r;changed=true}
    else if(!r&&l){localAhead=true}
    else if(r&&l){
      if((r.ts||0)>(l.ts||0)){items[id]=r;changed=true}
      else if((l.ts||0)>(r.ts||0)){localAhead=true}
      else if(JSON.stringify(r)!==JSON.stringify(l)){localAhead=true}
    }
  });
  if(changed){save();render()}
  return localAhead;
}
async function pull(){
  setSt('🔄 同步中…');
  try{
    const r=await fetch(EP,{cache:'no-store'});
    if(!r.ok)return setSt('🟡 离线·仅本机记录,联网自动补');
    const localAhead=mergeRemote((await r.json()).items||{});
    if(localAhead)schedPush(0);else setSt('🟢 已同步');
  }catch(e){setSt('🟡 离线·仅本机记录,联网自动补')}
}
function schedPush(d){clearTimeout(pushTimer);pushTimer=setTimeout(doPush,d===0?200:1200)}
async function doPush(){
  if(pushing)return schedPush();
  pushing=true;setSt('🔄 同步中…');
  try{
    const r=await fetch(EP,{cache:'no-store'});
    if(r.ok)mergeRemote((await r.json()).items||{});
    const w=await fetch(EP,{method:'PUT',body:JSON.stringify({v:1,items})});
    setSt(w.ok?'🟢 已同步':'🟡 同步失败·数据在本机没丢');
  }catch(e){setSt('🟡 离线·仅本机记录,联网自动补')}
  pushing=false;
}
stEl.onclick=pull;
render();pull();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body></html>
