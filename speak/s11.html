<head>

<title>私人学习空间</title>
<style>:root{--paper:#FBF7F0;--ink:#2B2620;--terra:#C15F3C;--line:#E8DDCD;--muted:#8A7F72;--card:#fff}
@media(prefers-color-scheme:dark){:root{--paper:#211C17;--ink:#EDE6DC;--terra:#DD8158;--line:#3C342B;--muted:#A79A8B;--card:#2A241E}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Songti SC",sans-serif;-webkit-text-size-adjust:100%}
#jrxGate{visibility:hidden;min-height:100%;display:flex;align-items:center;justify-content:center;padding:30px 18px}
.jrxCard{width:100%;max-width:330px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--terra);border-radius:14px;padding:30px 24px 26px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.jrxLock{font-size:34px;line-height:1}
.jrxCard h1{font-size:19px;color:var(--terra);margin:12px 0 6px;font-weight:600}
.jrxHint{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7}
#jrxPw{width:100%;padding:13px 14px;font-size:17px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;text-align:center;letter-spacing:2px;outline:none;-webkit-appearance:none}
#jrxPw:focus{border-color:var(--terra)}
#jrxGo{width:100%;margin-top:14px;padding:13px;font-size:16px;font-family:inherit;letter-spacing:4px;color:#fff;background:var(--terra);border:0;border-radius:10px;cursor:pointer}
#jrxGo:disabled{opacity:.55}
#jrxGo:active{opacity:.8}
#jrxErr{min-height:20px;margin-top:12px;font-size:13px;color:#C0392B}
@media(prefers-color-scheme:dark){#jrxErr{color:#E8877A}}
.jrxFoot{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7}
.jrxHidden{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<div id="jrxGate"><form class="jrxCard" id="jrxForm">

<script>(function(){
"use strict";
function el(id){return document.getElementById(id);}
var node=el("jrxData"),D;
try{D=JSON.parse(node.textContent);}catch(e){D=null;}
if(!D){document.documentElement.innerHTML="<p style=\"padding:40px;font:16px sans-serif\">页面数据损坏，请联系维护者。</p>";return;}
var CK="jrx.k."+D.s.substring(0,10);

function toBuf(a){var s=atob(a),u=new Uint8Array(s.length),i;for(i=0;i<s.length;i++){u[i]=s.charCodeAt(i);}return u;}
function toB64(b){var u=new Uint8Array(b),s="",i;for(i=0;i<u.length;i++){s+=String.fromCharCode(u[i]);}return btoa(s);}

var store=null;
try{localStorage.setItem("jrx.t","1");localStorage.removeItem("jrx.t");store=localStorage;}catch(e){}
if(!store){try{sessionStorage.setItem("jrx.t","1");sessionStorage.removeItem("jrx.t");store=sessionStorage;}catch(e){}}
function sGet(k){try{return store?store.getItem(k):null;}catch(e){return null;}}
function sSet(k,v){try{if(store){store.setItem(k,v);}}catch(e){}}
function sDel(k){try{if(store){store.removeItem(k);}}catch(e){}}

function whenReady(fn){
  if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",fn);}
  else{fn();}
}
function showGate(msg){
  whenReady(function(){
    var g=el("jrxGate");
    if(g){g.style.visibility="visible";}
    if(msg){var e2=el("jrxErr");if(e2){e2.textContent=msg;}}
  });
}
function reveal(html){
  whenReady(function(){
    try{document.open();document.write(html);document.close();}
    catch(e){document.documentElement.innerHTML=html;}
  });
}

if(!window.crypto||!window.crypto.subtle){
  showGate("此浏览器无法解密：请确认用 https:// 网址打开本页。");
  return;
}
var SUB=window.crypto.subtle;

function importAes(raw){return SUB.importKey("raw",raw,{name:"AES-GCM"},true,["decrypt"]);}
function decryptWith(key){
  return SUB.decrypt({name:"AES-GCM",iv:toBuf(D.i)},key,toBuf(D.c)).then(function(buf){
    return new TextDecoder("utf-8").decode(buf);
  });
}
function derive(pw){
  return SUB.importKey("raw",new TextEncoder().encode(pw),{name:"PBKDF2"},false,["deriveKey"]).then(function(base){
    return SUB.deriveKey({name:"PBKDF2",salt:toBuf(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  });
}

var cached=sGet(CK);
if(cached){
  importAes(toBuf(cached)).then(decryptWith).then(reveal).catch(function(){sDel(CK);showGate("");});
}else{
  showGate("");
}

whenReady(function(){
  var f=el("jrxForm");
  if(!f){return;}
  f.addEventListener("submit",function(ev){
    ev.preventDefault();
    var input=el("jrxPw"),btn=el("jrxGo"),err=el("jrxErr");
    var pw=input.value||"";
    if(!pw){err.textContent="请输入密码";return;}
    btn.disabled=true;btn.textContent="解密中…";err.textContent="";
    derive(pw).then(function(key){
      return decryptWith(key).then(function(html){
        return SUB.exportKey("raw",key).then(function(raw){sSet(CK,toB64(raw));return html;});
      });
    }).then(reveal).catch(function(){
      btn.disabled=false;btn.textContent="进 入";
      err.textContent="密码不对，请再试一次";
      input.value="";
      try{input.focus();}catch(e){}
    });
  });
});
})();
</script>
</body>
</html>
