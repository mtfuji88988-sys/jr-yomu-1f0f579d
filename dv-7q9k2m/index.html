<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>随身专区</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#FAF6EF;color:#3d3a34;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  line-height:1.7;padding:32px 18px 40px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto}
header{margin-bottom:26px}
h1{font-size:24px;font-weight:700;letter-spacing:.5px;color:#3d3a34}
h1::after{content:"";display:block;width:44px;height:3px;background:#C15F3C;border-radius:2px;margin-top:10px}
.hi{margin-top:12px;font-size:13.5px;color:#8d8579}
.card{
  display:block;text-decoration:none;color:inherit;
  background:#FFFDF9;border:1px solid #EBE2D4;border-radius:16px;
  padding:20px 20px 18px;margin:14px 0;
  box-shadow:0 2px 10px rgba(93,74,50,.06);
  transition:transform .12s ease,box-shadow .12s ease;
  position:relative;min-height:88px;
}
.card:active{transform:scale(.985);box-shadow:0 1px 5px rgba(93,74,50,.09)}
.card .t{font-size:18.5px;font-weight:600;color:#3d3a34;padding-right:26px}
.card .s{font-size:13px;color:#8d8579;margin-top:5px;line-height:1.6}
.card .arrow{
  position:absolute;right:20px;top:22px;
  color:#C15F3C;font-size:19px;font-weight:600;line-height:1;
}
.card .bar{
  position:absolute;left:0;top:18px;bottom:18px;width:4px;
  background:#C15F3C;border-radius:0 3px 3px 0;
}
footer{margin-top:30px;text-align:center;font-size:11.5px;color:#b0a698;letter-spacing:.3px}
@media (min-width:480px){
  body{padding-top:44px}
  h1{font-size:26px}
  .card .t{font-size:19.5px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>随身专区</h1>
    <div class="hi">David 的手机端总入口 · 点开即达</div>
  </header>

  <a class="card" href="../dm-4h7p2x/">
    <span class="bar"></span>
    <div class="t">随身页</div>
    <div class="s">管家发到手机的路线 / 清单 / 备忘</div>
    <span class="arrow">›</span>
  </a>

  <a class="card" href="../sl-9k2x4v/">
    <span class="bar"></span>
    <div class="t">购物清单</div>
    <div class="s">随时加、买完勾</div>
    <span class="arrow">›</span>
  </a>

  <a class="card" href="../hub/">
    <span class="bar"></span>
    <div class="t">学习总入口</div>
    <div class="s">日语学习全部入口</div>
    <span class="arrow">›</span>
  </a>

  <a class="card" href="../hc-k7m3x9/">
    <span class="bar"></span>
    <div class="t">健康打卡</div>
    <div class="s">每日打卡 · 30天热力图</div>
    <span class="arrow">›</span>
  </a>

  <footer>仅供本人使用 · 不收录搜索</footer>

</div>
</body>
</html>
